<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PikHero Admin</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    background:#07111f;
    color:#fff;
    font-family:Arial,sans-serif;
}

.container{
    max-width:1000px;
    margin:auto;
    padding:20px;
}

.login-box{
    max-width:430px;
    margin:70px auto;
    background:#0d1b2a;
    padding:25px;
    border-radius:15px;
}

h1,h2{
    color:#22c55e;
}

.login-box h1{
    text-align:center;
}

.subtitle{
    text-align:center;
    color:#9fb0c3;
    margin-bottom:25px;
}

input,select{
    width:100%;
    padding:13px;
    margin:7px 0 15px;
    border-radius:8px;
    border:1px solid #30465c;
    background:#07111f;
    color:#fff;
}

button{
    padding:11px 16px;
    border:0;
    border-radius:8px;
    cursor:pointer;
    font-weight:bold;
}

.login-button,
.add-button{
    width:100%;
    background:#22c55e;
    color:#04100a;
}

.logout{
    background:#dc2626;
    color:white;
}

.edit{
    background:#2563eb;
    color:white;
}

.publish{
    background:#f59e0b;
    color:#111;
}

.delete{
    background:#dc2626;
    color:white;
}

.cancel{
    background:#475569;
    color:white;
}

.message{
    display:none;
    padding:12px;
    border-radius:8px;
    margin:15px 0;
    white-space:pre-wrap;
}

.success{
    display:block;
    background:#064e3b;
    color:#a7f3d0;
}

.error{
    display:block;
    background:#7f1d1d;
    color:#fecaca;
}

.card{
    background:#0d1b2a;
    border:1px solid #1c354d;
    border-radius:15px;
    padding:20px;
    margin-bottom:20px;
}

.header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:15px;
    margin-bottom:20px;
}

.header p{
    color:#9fb0c3;
}

.form-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px 15px;
}

.full{
    grid-column:1/-1;
}

.item{
    background:#07111f;
    border:1px solid #263c50;
    border-radius:10px;
    padding:15px;
    margin-bottom:12px;
}

.item-title{
    font-size:17px;
    font-weight:bold;
    margin-bottom:8px;
}

.info{
    color:#b7c4d1;
    line-height:1.8;
}

.actions{
    display:flex;
    gap:8px;
    flex-wrap:wrap;
    margin-top:12px;
}

.badge{
    display:inline-block;
    padding:4px 8px;
    border-radius:5px;
    font-size:12px;
    font-weight:bold;
}

.green{
    background:#065f46;
    color:#a7f3d0;
}

.orange{
    background:#78350f;
    color:#fde68a;
}

.red{
    background:#7f1d1d;
    color:#fecaca;
}

.dashboard{
    display:none;
}

#editPredictionCard{
    display:none;
}

@media(max-width:700px){

    .container{
        padding:12px;
    }

    .form-grid{
        grid-template-columns:1fr;
    }

    .full{
        grid-column:auto;
    }

    .header{
        align-items:flex-start;
        flex-direction:column;
    }
}
</style>
</head>

<body>


<!-- ================= LOGIN ================= -->

<div id="loginScreen" class="login-box">

    <h1>⚽ PikHero Admin</h1>

    <div class="subtitle">
        Admin Login
    </div>

    <div id="loginMessage" class="message"></div>

    <label>Email</label>

    <input
        id="email"
        type="email"
        placeholder="Admin email"
    >

    <label>Password</label>

    <input
        id="password"
        type="password"
        placeholder="Password"
    >

    <button
        id="loginButton"
        class="login-button"
        onclick="login()"
    >
        Login
    </button>

</div>


<!-- ================= DASHBOARD ================= -->

<div id="dashboard" class="dashboard">

<div class="container">

    <div class="header">

        <div>
            <h1>⚽ PikHero Admin</h1>
            <p>Manage predictions and results</p>
        </div>

        <button
            class="logout"
            onclick="logout()"
        >
            Logout
        </button>

    </div>


    <div id="dashboardMessage" class="message"></div>


    <!-- ================= ADD PREDICTION ================= -->

    <div class="card">

        <h2>➕ Add Prediction</h2>

        <form id="predictionForm">

            <div class="form-grid">

                <div class="full">

                    <label>Match</label>

                    <input
                        id="match"
                        type="text"
                        placeholder="Manchester United vs Arsenal"
                        required
                    >

                </div>


                <div>

                    <label>Tip</label>

                    <input
                        id="tip"
                        type="text"
                        placeholder="Over 1.5"
                        required
                    >

                </div>


                <div>

                    <label>Odd</label>

                    <input
                        id="odd"
                        type="number"
                        step="0.01"
                        placeholder="1.35"
                        required
                    >

                </div>


                <div>

                    <label>Chance</label>

                    <input
                        id="chance"
                        type="text"
                        placeholder="85%"
                    >

                </div>


                <div>

                    <label>Date</label>

                    <input
                        id="predictionDate"
                        type="date"
                        required
                    >

                </div>


                <div>

                    <label>Publish</label>

                    <select id="published">

                        <option value="true">
                            Published
                        </option>

                        <option value="false">
                            Unpublished
                        </option>

                    </select>

                </div>

            </div>


            <button
                type="submit"
                class="add-button"
            >
                Add Prediction
            </button>

        </form>

    </div>


    <!-- ================= EDIT PREDICTION ================= -->

    <div
        id="editPredictionCard"
        class="card"
    >

        <h2>✏️ Edit Prediction</h2>

        <input
            type="hidden"
            id="editId"
        >


        <label>Match</label>

        <input
            id="editMatch"
            type="text"
        >


        <label>Tip</label>

        <input
            id="editTip"
            type="text"
        >


        <label>Odd</label>

        <input
            id="editOdd"
            type="number"
            step="0.01"
        >


        <label>Chance</label>

        <input
            id="editChance"
            type="text"
        >


        <label>Date</label>

        <input
            id="editDate"
            type="date"
        >


        <label>Publish</label>

        <select id="editPublished">

            <option value="true">
                Published
            </option>

            <option value="false">
                Unpublished
            </option>

        </select>


        <div class="actions">

            <button
                class="edit"
                onclick="saveEdit()"
            >
                Save Changes
            </button>

            <button
                class="cancel"
                onclick="cancelEdit()"
            >
                Cancel
            </button>

        </div>

    </div>


    <!-- ================= PREDICTIONS ================= -->

    <div class="card">

        <h2>📋 Predictions</h2>

        <div id="predictionsList">
            Loading...
        </div>

    </div>


    <!-- ================= ADD RESULT ================= -->

    <div class="card">

        <h2>➕ Add Result</h2>

        <form id="resultForm">

            <label>Match</label>

            <input
                id="resultMatch"
                type="text"
                placeholder="Manchester United 2-1 Arsenal"
                required
            >


            <label>Tip</label>

            <input
                id="resultTip"
                type="text"
                placeholder="Over 1.5"
                required
            >


            <label>Status</label>

            <select id="resultStatus">

                <option value="WIN">
                    WIN
                </option>

                <option value="LOSS">
                    LOSS
                </option>

                <option value="PENDING">
                    PENDING
                </option>

            </select>


            <label>Date</label>

            <input
                id="resultDate"
                type="date"
                required
            >


            <button
                type="submit"
                class="add-button"
            >
                Add Result
            </button>

        </form>

    </div>


    <!-- ================= RESULTS ================= -->

    <div class="card">

        <h2>📊 Results</h2>

        <div id="resultsList">
            Loading...
        </div>

    </div>

</div>

</div>


<script>

/* ==================================================
   SUPABASE
================================================== */

const SUPABASE_URL =
"https://bfxiiedvmapxqjiqcqxe.supabase.co";


const SUPABASE_KEY =
"sb_publishable_paCTE7VNOtkKS_z5E4Up5w_j_oFpGXg";


const supabaseClient =
window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);


/* ==================================================
   HELPERS
================================================== */

function today(){

    const d = new Date();

    return d.getFullYear() +
        "-" +
        String(d.getMonth()+1).padStart(2,"0") +
        "-" +
        String(d.getDate()).padStart(2,"0");
}


function escapeHTML(value){

    if(value === null ||
       value === undefined){

        return "";
    }

    return String(value)
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");
}


function showLoginMessage(
    text,
    type
){

    const box =
        document.getElementById(
            "loginMessage"
        );

    box.textContent = text;

    box.className =
        "message " + type;
}


function showDashboardMessage(
    text,
    type
){

    const box =
        document.getElementById(
            "dashboardMessage"
        );

    box.textContent = text;

    box.className =
        "message " + type;

    setTimeout(function(){

        box.className = "message";

    },5000);
}


/* ==================================================
   LOGIN
================================================== */

async function login(){

    const email =
        document.getElementById(
            "email"
        ).value.trim();


    const password =
        document.getElementById(
            "password"
        ).value;


    const button =
        document.getElementById(
            "loginButton"
        );


    if(!email || !password){

        showLoginMessage(
            "Please enter your email and password.",
            "error"
        );

        return;
    }


    showLoginMessage(
        "Button is working. Connecting to Supabase...",
        "success"
    );


    button.disabled = true;

    button.textContent =
        "Logging in...";


    try{

        const {data,error} =
            await supabaseClient
            .auth
            .signInWithPassword({

                email:email,
                password:password

            });


        if(error){

            showLoginMessage(
                "Supabase error:\n" +
                error.message,
                "error"
            );

            button.disabled = false;

            button.textContent =
                "Login";

            return;
        }


        if(data.session){

            document.getElementById(
                "loginScreen"
            ).style.display = "none";


            document.getElementById(
                "dashboard"
            ).style.display = "block";


            document.getElementById(
                "predictionDate"
            ).value = today();


            document.getElementById(
                "resultDate"
            ).value = today();


            await loadPredictions();

            await loadResults();

        }

    }catch(error){

        showLoginMessage(
            "JavaScript error:\n" +
            error.message,
            "error"
        );

        button.disabled = false;

        button.textContent =
            "Login";
    }
}


/* ==================================================
   LOGOUT
================================================== */

async function logout(){

    await supabaseClient
        .auth
        .signOut();

    location.reload();
}


/* ==================================================
   ADD PREDICTION
================================================== */

document.getElementById(
    "predictionForm"
).addEventListener(
    "submit",
    async function(event){

        event.preventDefault();


        const record = {

            match:
                document.getElementById(
                    "match"
                ).value.trim(),

            tip:
                document.getElementById(
                    "tip"
                ).value.trim(),

            odd:
                parseFloat(
                    document.getElementById(
                        "odd"
                    ).value
                ),

            chance:
                document.getElementById(
                    "chance"
                ).value.trim(),

            prediction_date:
                document.getElementById(
                    "predictionDate"
                ).value,

            published:
                document.getElementById(
                    "published"
                ).value === "true"

        };


        const {error} =
            await supabaseClient
            .from("predictions")
            .insert(record);


        if(error){

            showDashboardMessage(
                "Error adding prediction:\n" +
                error.message,
                "error"
            );

            return;
        }


        showDashboardMessage(
            "✅ Prediction added successfully.",
            "success"
        );


        document.getElementById(
            "predictionForm"
        ).reset();


        document.getElementById(
            "predictionDate"
        ).value = today();


        await loadPredictions();

    }
);


/* ==================================================
   LOAD PREDICTIONS
================================================== */

async function loadPredictions(){

    const box =
        document.getElementById(
            "predictionsList"
        );


    box.innerHTML =
        "Loading predictions...";


    const {data,error} =
        await supabaseClient
        .from("predictions")
        .select("*")
        .order(
            "prediction_date",
            {ascending:false}
        )
        .order(
            "created_at",
            {ascending:false}
        );


    if(error){

        box.innerHTML =
            '<div class="message error">' +
            escapeHTML(error.message) +
            '</div>';

        return;
    }


    if(!data || data.length === 0){

        box.innerHTML =
            "No predictions yet.";

        return;
    }


    box.innerHTML =
        data.map(function(item){

            const status =
                item.published

                ? '<span class="badge green">PUBLISHED</span>'

                : '<span class="badge orange">UNPUBLISHED</span>';


            return `

            <div class="item">

                <div class="item-title">
                    ${escapeHTML(item.match)}
                </div>

                <div class="info">

                    Tip:
                    <strong>
                        ${escapeHTML(item.tip)}
                    </strong>

                    <br>

                    Odd:
                    <strong>
                        ${escapeHTML(item.odd)}
                    </strong>

                    <br>

                    Chance:
                    <strong>
                        ${escapeHTML(item.chance || "-")}
                    </strong>

                    <br>

                    Date:
                    ${escapeHTML(item.prediction_date)}

                    <br>

                    Status:
                    ${status}

                </div>


                <div class="actions">

                    <button
                        class="edit"
                        onclick="editPrediction(${item.id})"
                    >
                        ✏️ Edit
                    </button>


                    <button
                        class="publish"
                        onclick="togglePublish(
                            ${item.id},
                            ${item.published}
                        )"
                    >
                        ${item.published
                            ? "Unpublish"
                            : "Publish"}
                    </button>


                    <button
                        class="delete"
                        onclick="deletePrediction(${item.id})"
                    >
                        🗑️ Delete
                    </button>

                </div>

            </div>

            `;

        }).join("");
}


/* ==================================================
   EDIT PREDICTION
================================================== */

async function editPrediction(id){

    const {data,error} =
        await supabaseClient
        .from("predictions")
        .select("*")
        .eq("id",id)
        .single();


    if(error){

        showDashboardMessage(
            "Error:\n" + error.message,
            "error"
        );

        return;
    }


    document.getElementById(
        "editId"
    ).value = data.id;


    document.getElementById(
        "editMatch"
    ).value = data.match;


    document.getElementById(
        "editTip"
    ).value = data.tip;


    document.getElementById(
        "editOdd"
    ).value = data.odd;


    document.getElementById(
        "editChance"
    ).value = data.chance || "";


    document.getElementById(
        "editDate"
    ).value = data.prediction_date;


    document.getElementById(
        "editPublished"
    ).value =
        data.published
        ? "true"
        : "false";


    document.getElementById(
        "editPredictionCard"
    ).style.display = "block";


    window.scrollTo({
        top:0,
        behavior:"smooth"
    });
}


/* ==================================================
   SAVE EDIT
================================================== */

async function saveEdit(){

    const id =
        document.getElementById(
            "editId"
        ).value;


    const updates = {

        match:
            document.getElementById(
                "editMatch"
            ).value.trim(),

        tip:
            document.getElementById(
                "editTip"
            ).value.trim(),

        odd:
            parseFloat(
                document.getElementById(
                    "editOdd"
                ).value
            ),

        chance:
            document.getElementById(
                "editChance"
            ).value.trim(),

        prediction_date:
            document.getElementById(
                "editDate"
            ).value,

        published:
            document.getElementById(
                "editPublished"
            ).value === "true"

    };


    const {error} =
        await supabaseClient
        .from("predictions")
        .update(updates)
        .eq("id",id);


    if(error){

        showDashboardMessage(
            "Error saving changes:\n" +
            error.message,
            "error"
        );

        return;
    }


    showDashboardMessage(
        "✅ Prediction updated.",
        "success"
    );


    cancelEdit();

    await loadPredictions();
}


/* ==================================================
   CANCEL EDIT
================================================== */

function cancelEdit(){

    document.getElementById(
        "editPredictionCard"
    ).style.display = "none";
}


/* ==================================================
   PUBLISH / UNPUBLISH
================================================== */

async function togglePublish(
    id,
    current
){

    const {error} =
        await supabaseClient
        .from("predictions")
        .update({
            published:!current
        })
        .eq("id",id);


    if(error){

        showDashboardMessage(
            "Error:\n" +
            error.message,
            "error"
        );

        return;
    }


    showDashboardMessage(
        current
        ? "Prediction unpublished."
        : "Prediction published.",
        "success"
    );


    await loadPredictions();
}


/* ==================================================
   DELETE PREDICTION
================================================== */

async function deletePrediction(id){

    if(!confirm(
        "Delete this prediction?"
    )){

        return;
    }


    const {error} =
        await supabaseClient
        .from("predictions")
        .delete()
        .eq("id",id);


    if(error){

        showDashboardMessage(
            "Error:\n" +
            error.message,
            "error"
        );

        return;
    }


    showDashboardMessage(
        "Prediction deleted.",
        "success"
    );


    await loadPredictions();
}


/* ==================================================
   ADD RESULT
================================================== */

document.getElementById(
    "resultForm"
).addEventListener(
    "submit",
    async function(event){

        event.preventDefault();


        const record = {

            match:
                document.getElementById(
                    "resultMatch"
                ).value.trim(),

            tip:
                document.getElementById(
                    "resultTip"
                ).value.trim(),

            status:
                document.getElementById(
                    "resultStatus"
                ).value,

            result_date:
                document.getElementById(
                    "resultDate"
                ).value

        };


        const {error} =
            await supabaseClient
            .from("results")
            .insert(record);


        if(error){

            showDashboardMessage(
                "Error adding result:\n" +
                error.message,
                "error"
            );

            return;
        }


        showDashboardMessage(
            "✅ Result added successfully.",
            "success"
        );


        document.getElementById(
            "resultForm"
        ).reset();


        document.getElementById(
            "resultDate"
        ).value = today();


        await loadResults();

    }
);


/* ==================================================
   LOAD RESULTS
================================================== */

async function loadResults(){

    const box =
        document.getElementById(
            "resultsList"
        );


    box.innerHTML =
        "Loading results...";


    const {data,error} =
        await supabaseClient
        .from("results")
        .select("*")
        .order(
            "result_date",
            {ascending:false}
        )
        .order(
            "created_at",
            {ascending:false}
        );


    if(error){

        box.innerHTML =
            '<div class="message error">' +
            escapeHTML(error.message) +
            '</div>';

        return;
    }


    if(!data || data.length === 0){

        box.innerHTML =
            "No results yet.";

        return;
    }


    box.innerHTML =
        data.map(function(item){

            let badge;


            if(item.status === "WIN"){

                badge =
                    '<span class="badge green">WIN</span>';

            }else if(
                item.status === "LOSS"
            ){

                badge =
                    '<span class="badge red">LOSS</span>';

            }else{

                badge =
                    '<span class="badge orange">PENDING</span>';
            }


            return `

            <div class="item">

                <div class="item-title">
                    ${escapeHTML(item.match)}
                </div>

                <div class="info">

                    Tip:
                    <strong>
                        ${escapeHTML(item.tip)}
                    </strong>

                    <br>

                    Status:
                    ${badge}

                    <br>

                    Date:
                    ${escapeHTML(item.result_date)}

                </div>


                <div class="actions">

                    <button
                        class="delete"
                        onclick="deleteResult(${item.id})"
                    >
                        🗑️ Delete
                    </button>

                </div>

            </div>

            `;

        }).join("");
}


/* ==================================================
   DELETE RESULT
================================================== */

async function deleteResult(id){

    if(!confirm(
        "Delete this result?"
    )){

        return;
    }


    const {error} =
        await supabaseClient
        .from("results")
        .delete()
        .eq("id",id);


    if(error){

        showDashboardMessage(
            "Error:\n" +
            error.message,
            "error"
        );

        return;
    }


    showDashboardMessage(
        "Result deleted.",
        "success"
    );


    await loadResults();
}

</script>

</body>
</html>
